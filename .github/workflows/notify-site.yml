name: Notify site to sync scripts

on:
  push:
    branches: [main]
    paths: ['**.ps1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/chaimyuirbrief/chaimyuirmafia.com/dispatches \
            -d "{\"event_type\":\"scripts-updated\",\"client_payload\":{\"sha\":\"${SHA}\"}}"
